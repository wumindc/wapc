<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="WAPC — 本机优先、无侵入的 AI 编程工具统一观测与管理工具">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#141E33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="260" fill="url(#glow)"/>

  <!-- subtle dotted grid -->
  <g fill="#21304A">
    <circle cx="60" cy="260" r="2"/><circle cx="100" cy="260" r="2"/><circle cx="140" cy="260" r="2"/>
    <circle cx="60" cy="290" r="2"/><circle cx="100" cy="290" r="2"/><circle cx="140" cy="290" r="2"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="150" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#F8FAFC" letter-spacing="2">WAPC</text>
  <rect x="84" y="172" width="132" height="6" rx="3" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="86" y="214" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#C7D2E5">本机优先 · 无侵入 · AI 编程工具统一观测与管理</text>
  <text x="86" y="250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#7C8AA5">观测用量与成本 · 统一管理 Skills / MCP / Plugins / 指令文件 · 安全同步注入</text>

  <!-- tool chips -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(86,278)">
      <rect width="118" height="30" rx="15" fill="#1B2740" stroke="#2A3A57"/>
      <circle cx="20" cy="15" r="5" fill="#CC785C"/>
      <text x="34" y="20" fill="#C7D2E5">Claude Code</text>
    </g>
    <g transform="translate(214,278)">
      <rect width="78" height="30" rx="15" fill="#1B2740" stroke="#2A3A57"/>
      <circle cx="20" cy="15" r="5" fill="#3B82F6"/>
      <text x="34" y="20" fill="#C7D2E5">Codex</text>
    </g>
    <g transform="translate(302,278)">
      <rect width="104" height="30" rx="15" fill="#1B2740" stroke="#2A3A57"/>
      <circle cx="20" cy="15" r="5" fill="#7E57EB"/>
      <text x="34" y="20" fill="#C7D2E5">Gemini CLI</text>
    </g>
    <g transform="translate(416,278)">
      <rect width="104" height="30" rx="15" fill="#1B2740" stroke="#2A3A57"/>
      <circle cx="20" cy="15" r="5" fill="#F1761F"/>
      <text x="34" y="20" fill="#C7D2E5">OpenCode</text>
    </g>
  </g>

  <!-- macOS badge -->
  <g transform="translate(1000,40)">
    <rect width="120" height="34" rx="17" fill="#101A2E" stroke="#2A3A57"/>
    <text x="60" y="22" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9FB1CC">macOS first</text>
  </g>
</svg>
