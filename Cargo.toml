[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "wapc"
version = "0.2.2"
edition = "2024"

[lib]
name = "wapc"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
dirs-next = "2.0.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = "0.8.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
